name: Rock Telegram Publisher

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

jobs:
  publish-rock:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run rock publisher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ vars.ROCK_TELEGRAM_CHANNEL }} 
        run: |
          python agent_rock.py

      - name: Save rock episode history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add recent_posts_rock.json

          if git diff --cached --quiet; then
            echo "No changes to save"
          else
            git commit -m "Update rock episode history"
            git push
          fi